<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luana Monteiro">

<meta name="application-name" content="Luana Monteiro">
<meta name="theme-color" content="#f6f2ee">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/cormorant-garamond-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/cormorant-garamond-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-display:swap;font-weight:300 700;src:url(fonts/cormorant-garamond-latin-wght-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Jost";font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/jost-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Jost";font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/jost-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif; --sans:"Jost",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#f6f2ee; --card:#fff; --ink:#2f2a27; --muted:#8a7f78; --line:#ebe3dc;
  --rose:#b7826f; --rose-d:#9a6a58; --rose-l:#f4e8e2; --sage:#7d9283; --sage-l:#e6ece7;
  --side:#2f2724; --side-ink:#d9cdc6; --danger:#b4534a;
  --radius:14px; --shadow:0 1px 2px rgba(60,40,30,.05),0 4px 16px rgba(60,40,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--serif);font-weight:normal;margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.side .brand{display:flex;gap:10px;align-items:center;padding:22px 18px 18px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 2px var(--rose),inset 0 0 0 3px rgba(255,255,255,.7)}
.side .brand b{display:block;color:#fff;font-family:var(--serif);font-weight:normal;font-size:16px;line-height:1.2}
.side .brand small{font-size:11px;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.5;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--side-ink);font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--rose);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav a .cnt{margin-left:auto;font-size:11px;opacity:.7}
.side .foot{padding:14px 18px;font-size:11px;opacity:.6;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 28px 14px;background:rgba(246,242,238,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.topbar .menu{display:none}
.gsearch{flex:1;max-width:560px;min-width:0;position:relative}
.gsearch input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:11px;background:#fff}
.gsearch::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--muted);font-size:18px}
.gsearch .res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;display:none}
.gsearch .res.on{display:block}
.gsearch .res a{display:flex;gap:10px;align-items:center;padding:9px 12px;text-decoration:none;font-size:14px}
.gsearch .res a:hover,.gsearch .res a.hl{background:var(--rose-l)}
.gsearch .res .m{color:var(--muted);font-size:12px}
.topbar .sp{flex:1}
.content{padding:24px 32px 70px;max-width:1480px;width:100%;margin:0 auto}
.ptitle{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ptitle h2{font-size:28px}
.ptitle p{margin:2px 0 0;color:var(--muted)}
.ptitle .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- componentes ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:var(--rose-d)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--rose-l)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 a{margin-left:auto;font-family:var(--sans);font-size:13px;color:var(--rose-d);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;border:1px solid transparent}
.kpi:hover{border-color:var(--rose-l)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--serif);font-size:34px;line-height:1.1;margin-top:6px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.dash .col{display:flex;flex-direction:column;gap:16px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.quick button{background:#fff;border:1px dashed #dccfc6;border-radius:12px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.quick button:hover{border-color:var(--rose);border-style:solid}
.quick .qi{width:38px;height:38px;border-radius:10px;background:var(--rose-l);color:var(--rose-d);display:grid;place-items:center;font-size:18px;flex:none}
.quick b{display:block;font-weight:600;font-size:14px}
.quick small{color:var(--muted);font-size:12px}
.li{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:#fcfaf8}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12.5px}
.li .r{color:var(--muted);font-size:12.5px;text-align:right;white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--rose-l);color:var(--rose-d);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.bars .b{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bars .b span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:8px;background:var(--rose-l);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;background:var(--rose);border-radius:5px}
.bars .b span:last-child{text-align:right;color:var(--muted)}
.none{color:var(--muted);font-size:14px;padding:6px 0}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.filters input[type=search]{flex:1;min-width:220px}
.filters .muted{margin-left:auto}
table.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:12px 14px;background:#fbf8f5;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.s::after{content:" ↓"} .tbl th.s.asc::after{content:" ↑"}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#fcf8f5}
.tbl .who{display:flex;gap:10px;align-items:center}
.tbl .who .avatar{width:34px;height:34px;font-size:12px}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--rose-l);color:var(--rose-d)}
.pill.g{background:var(--sage-l);color:#4d6153}
.pill.w{background:#fff3df;color:#8a6420}
.muted{color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty h2{color:var(--ink);margin-bottom:6px}

/* ficha */
.chead{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chead .avatar{width:64px;height:64px;font-size:22px}
.chead h2{font-size:26px}
.chead .meta{color:var(--muted)}
.chead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:none;background:none;padding:10px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tab.on{color:var(--ink);border-color:var(--rose)}
.tab .count{background:var(--rose-l);color:var(--rose-d);border-radius:20px;padding:0 7px;font-size:12px;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose-l);border-color:var(--rose)!important}
.section-t{font-family:var(--serif);font-size:18px;margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.section-t:first-child{margin-top:0}
.formbar{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;position:sticky;bottom:10px}
.formbar .card{display:flex;gap:10px;padding:10px;align-items:center}
.q{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.q .txt{font-size:14px}
.q .yn{display:flex;gap:4px}
.q .yn label{border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;user-select:none}
.q .yn input{display:none}
.q .yn label:has(input[value=sim]:checked){background:var(--rose-l);border-color:var(--rose);color:var(--rose-d);font-weight:600}
.q .yn label:has(input[value=nao]:checked){background:var(--sage-l);border-color:var(--sage);color:#4d6153;font-weight:600}
.q .det{grid-column:1/-1;display:none}
.q.sim .det{display:block}
.q .det input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.q .det2{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .det2 input{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fdfbf9}
.q .det2 .sub{font-size:13px;color:var(--muted);margin-left:4px}
.decl{background:#fbf7f4;border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14px}
.aval{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.arow .al{width:110px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{display:none}
.field label.chip{text-transform:none;letter-spacing:0;font-size:inherit;color:var(--ink)}
.decl label span{flex:1;min-width:0}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none;background:#fff}
.chip span:hover{border-color:var(--rose)}
.chip input:checked+span{background:var(--rose);border-color:var(--rose);color:#fff}
.mini{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:13px;width:120px}
.alert{background:var(--rose-l);color:var(--rose-d);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.alert b{color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .hint{color:var(--muted);font-size:13px;flex:1}
.timeline{display:flex;flex-direction:column;gap:12px}
.sess{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--rose)}
.sess .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sess .dt{font-weight:600}
.sess .proc{font-family:var(--serif);font-size:17px}
.sess .reg{color:var(--muted);font-size:13px}
.sess .h .act{margin-left:auto;display:flex;gap:4px}
.sess .body{margin-top:6px;white-space:pre-wrap;font-size:14px}
.sess .body .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;cursor:pointer;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:5px;top:5px;background:rgba(255,255,255,.92);color:var(--ink);font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.tag.antes{color:var(--rose-d)} .tag.depois{color:#4d6153}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ph{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);position:relative;border:2px solid transparent;cursor:pointer}
.ph.sel{border-color:var(--rose)}
.ph .img{aspect-ratio:3/4;background:#eee}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{padding:7px 9px;font-size:12px;color:var(--muted)}
.ph .cap b{color:var(--ink);font-weight:600}
.ph .n{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--rose);color:#fff;font-size:13px;display:none;place-items:center;font-weight:600}
.ph.sel .n{display:grid}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);background:#fffaf7;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--rose);color:var(--rose-d)}
.pending{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pend{width:150px;background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden;font-size:12px}
.pend img{width:100%;height:110px;object-fit:cover;display:block}
.pend .ctr{padding:6px;display:flex;flex-direction:column;gap:4px}
.pend select,.pend input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.proc-list .li{cursor:default}
.banner.sm{padding:7px 12px;font-size:13px}
.card.narrow{max-width:640px}
.remind{display:block;text-decoration:none;background:var(--rose-l);box-shadow:none;border:1px solid #ecd3c8;color:var(--rose-d);font-size:14px;padding:14px 18px}
.remind div{margin:2px 0;color:var(--ink)}
.remind span{display:block;margin-top:6px;font-size:13px}
.li .btn{flex:none}
.bnav{display:none}
.agenda{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.cal .calh{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal .calh h3{margin:0;min-width:170px;text-align:center}
.cal .dow,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:92px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font:inherit;color:inherit;overflow:hidden}
.cal .day:hover{border-color:var(--rose)}
.cal .day.out{background:#fbf8f5;color:#bcb1aa}
.cal .day .n{font-size:13px;font-weight:600}
.cal .day.today .n{background:var(--rose);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .day.sel{border:2px solid var(--rose);padding:5px;background:var(--rose-l)}
.cal .day .cnt{display:none;position:absolute;right:6px;top:6px;background:var(--rose);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
.cal .ev{display:block;font-size:11px;background:var(--rose-l);color:var(--rose-d);border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .day.sel .ev{background:#fff}
.cal .ev.realizado{background:var(--sage-l);color:#4d6153}
.cal .ev.faltou{background:#fff3df;color:#8a6420}
.cal .more{font-size:11px;color:var(--muted)}
.sub-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}
.li .hr,.appt .hr{font-weight:600;font-size:14px;width:48px;flex:none;color:var(--rose-d)}
.appt{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:none}
.appt .hr small{display:block;font-weight:normal;font-size:11px;color:var(--muted)}
.appt .t{flex:1;min-width:0}
.appt .t a{text-decoration:none}
.appt .t small{display:block;color:var(--muted);font-size:13px}
.appt .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}

/* =========================================================
   CAMADA DE DADOS
   Hoje: IndexedDB (fica no navegador do computador).
   Na versão online, só este bloco "DB" é trocado pela nuvem
   (Supabase) — o resto do sistema continua igual.
   ========================================================= */
const DB_NAME='fichas-estetica', DB_VER=3;
let idb;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains('clients'))d.createObjectStore('clients',{keyPath:'id'});
      if(!d.objectStoreNames.contains('sessions')){const s=d.createObjectStore('sessions',{keyPath:'id'});s.createIndex('clientId','clientId')}
      if(!d.objectStoreNames.contains('photos')){const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('clientId','clientId')}
      if(!d.objectStoreNames.contains('procedures'))d.createObjectStore('procedures',{keyPath:'id'});
      if(!d.objectStoreNames.contains('appointments')){const a=d.createObjectStore('appointments',{keyPath:'id'});a.createIndex('clientId','clientId')}
    };
    r.onsuccess=()=>{idb=r.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
const _st=(s,m='readonly')=>idb.transaction(s,m).objectStore(s);
const _rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const DB={
  all:s=>_rq(_st(s).getAll()),
  put:(s,v)=>_rq(_st(s,'readwrite').put(v)),
  del:(s,id)=>_rq(_st(s,'readwrite').delete(id)),
};

function age(b){if(!b)return'';const d=new Date(b+'T12:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<130?a+' anos':''}
function daysSince(d){return d?Math.floor((new Date(today())-new Date(d))/864e5):null}
function ago(d){const n=daysSince(d);if(n===null)return'';if(n<=0)return'hoje';if(n===1)return'ontem';if(n<30)return`há ${n} dias`;const m=Math.floor(n/30);return m<12?`há ${plural(m,'mês','meses')}`:`há ${plural(Math.floor(m/12),'ano','anos')}`}

function blobURL(b){const u=URL.createObjectURL(b);urls.push(u);return u}

async function compress(file,max=1600,q=.85){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bmp=await createImageBitmap(file)}
  const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));

function wireShell(){
  const side=$('#side'),scrim=$('#scrim');
  $('#menuBtn').onclick=()=>{side.classList.add('open');scrim.classList.add('on')};
  $('#bMore').onclick=e=>{e.preventDefault();side.classList.add('open');scrim.classList.add('on')};
  scrim.onclick=()=>{side.classList.remove('open');scrim.classList.remove('on')};
  // busca global com resultados instantâneos
  const gq=$('#gq'),gr=$('#gres');let hl=0,found=[];
  const draw=()=>{
    found=searchClients(gq.value).slice(0,7);
    if(!gq.value.trim()){gr.classList.remove('on');return}
    gr.innerHTML=found.length?found.map((c,i)=>`<a href="#/cliente/${c.id}" class="${i===hl?'hl':''}">${avatar(c)}<div><div>${esc(c.nome)}</div><div class="m">${esc(c.telefone||'')}</div></div></a>`).join('')
      :`<a href="#/nova" class="hl">Nenhuma cliente encontrada — <b>cadastrar nova</b></a>`;
    gr.classList.add('on');
  };
  gq.oninput=()=>{hl=0;draw()};
  gq.onkeydown=e=>{
    if(e.key==='ArrowDown'){hl=Math.min(hl+1,found.length-1);draw();e.preventDefault()}
    if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);draw();e.preventDefault()}
    if(e.key==='Enter'){if(found[hl])go('#/cliente/'+found[hl].id);else if(!found.length&&gq.value.trim())go('#/nova')}
    if(e.key==='Escape'){gq.value='';gr.classList.remove('on')}
  };
  gq.onblur=()=>setTimeout(()=>gr.classList.remove('on'),150);
}
function searchClients(q){
  q=norm(q).trim();const qd=q.replace(/\D/g,'');
  if(!q)return[...D.clients];
  return D.clients.filter(c=>norm(c.nome).includes(q)||(qd.length>=3&&(((c.telefone||'').replace(/\D/g,'').includes(qd))||((c.cpf||'').replace(/\D/g,'').includes(qd)))));
}
function installBanner(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inst=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!ios||inst||LS.get('fe-noinstall',false))return'';
  return `<div class="banner" style="background:var(--rose-l);border-color:#ecd3c8;color:var(--rose-d)"><span>📲 <b>Coloque o sistema na tela de início:</b> no Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>“Adicionar à Tela de Início”</b>.</span><button class="btn sm" onclick="LS.set('fe-noinstall',true);render()">Ok</button></div>`;
}
function backupBanner(){
  if(!D.clients.some(c=>!c.demo))return'';
  const last=LS.get('fe-lastbackup',0);const d=last?Math.floor((Date.now()-last)/864e5):null;
  if(d!==null&&d<7)return'';

}

/* ================= RELACIONAMENTO ================= */
function anivDoMes(mes){return D.clients.filter(c=>c.nascimento&&+c.nascimento.slice(5,7)===mes).sort((a,b)=>a.nascimento.slice(8).localeCompare(b.nascimento.slice(8)))}
function semRetorno(dias){return D.clients.map(c=>({c,u:sessOf(c.id)[0]})).filter(x=>x.u&&daysSince(x.u.data)>=dias&&!D.appointments.some(a=>a.clientId===x.c.id&&a.status==='agendado'&&a.data>=today())).sort((a,b)=>a.u.data.localeCompare(b.u.data))}
function waBtn(c,msg,label){const tel=(c.telefone||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
  return tel&&c.whatsapp!==false?`<a class="btn sm" target="_blank" onclick="event.stopPropagation()" href="https://wa.me/55${tel}?text=${encodeURIComponent(msg)}">${label}</a>`:''}
function subTabs(base,tabs,cur){return `<div class="tabs">${tabs.map(([k,l,n])=>`<a class="tab ${cur===k?'on':''}" href="${base}/${k}">${l}${n?`<span class="count">${n}</span>`:''}</a>`).join('')}</div>`}
function pRelac(r){
  const tab=['aniversariantes','sem-retorno','procedimentos'].includes(r.id)?r.id:'aniversariantes';
  ui.relMes=ui.relMes||new Date().getMonth()+1;ui.relDias=ui.relDias||60;
  const aniv=anivDoMes(ui.relMes),sum=semRetorno(ui.relDias),nome=settings().nome;
  let h=`<div class="ptitle"><div><h2>Relacionamento</h2><p>Datas especiais e clientes para chamar de volta</p></div></div>`+
    subTabs('#/relacionamento',[['aniversariantes','Aniversariantes',anivDoMes(new Date().getMonth()+1).length],['sem-retorno','Sem retorno',semRetorno(60).length],['procedimentos','Mais realizados']],tab);
  if(tab==='aniversariantes'){
    const meses=[...Array(12)].map((_,i)=>cap1(new Date(2026,i,1).toLocaleDateString('pt-BR',{month:'long'})));
    h+=`<div class="filters"><select onchange="ui.relMes=+this.value;render()">${meses.map((m,i)=>`<option value="${i+1}" ${ui.relMes===i+1?'selected':''}>${m}</option>`).join('')}</select><span class="muted">${plural(aniv.length,'aniversariante','aniversariantes')}</span></div>
    <div class="card">${aniv.length?aniv.map(c=>{const hojeA=c.nascimento.slice(5)===today().slice(5);
      return `<div class="li" onclick="go('#/cliente/${c.id}')">${avatar(c)}<div class="t"><b>${esc(c.nome)}</b><small>${fmtDate(c.nascimento).slice(0,5)}${hojeA?' · <b style="display:inline;color:var(--rose-d)">hoje!</b>':''}</small></div>${waBtn(c,`Feliz aniversário, ${c.nome.split(' ')[0]}! 🎉 A equipe do ${nome} deseja um dia lindo pra você!`,'Enviar parabéns')}</div>`}).join(''):'<div class="none">Nenhuma aniversariante neste mês.</div>'}</div>`;
  }
  if(tab==='sem-retorno'){
    h+=`<div class="filters"><select onchange="ui.relDias=+this.value;render()">${[30,60,90,180].map(d=>`<option value="${d}" ${ui.relDias===d?'selected':''}>Sem vir há ${d}+ dias</option>`).join('')}</select><span class="muted">${plural(sum.length,'cliente','clientes')} · quem já tem horário marcado não aparece aqui</span></div>
    <div class="card">${sum.length?sum.map(({c,u})=>`<div class="li" onclick="go('#/cliente/${c.id}/evolucao')">${avatar(c)}<div class="t"><b>${esc(c.nome)}</b><small>Último: ${esc(u.procedimento||'atendimento')} · ${ago(u.data)}</small></div>${waBtn(c,`Oi, ${c.nome.split(' ')[0]}! Tudo bem? Faz um tempinho que você não vem ao ${nome}. Quer agendar um horário? 💆‍♀️`,'Chamar no WhatsApp')}<button class="btn sm" onclick="event.stopPropagation();apptModal(null,{clientId:'${c.id}'})">Agendar</button></div>`).join(''):'<div class="none">Todas as clientes estão em dia. 👏</div>'}</div>`;
  }
  if(tab==='procedimentos'){
    const y=today().slice(0,4),cont={};D.sessions.filter(x=>(x.data||'').startsWith(y)).forEach(x=>{const k=x.procedimento||'Sem nome';cont[k]=(cont[k]||0)+1});
    const top=Object.entries(cont).sort((a,b)=>b[1]-a[1]);const mx=top[0]?.[1]||1;
    h+=`<div class="card"><h3>Procedimentos mais realizados em ${y}</h3>${top.length?`<div class="bars">${top.map(([k,v])=>`<div class="b"><span title="${esc(k)}">${esc(k)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><span>${v}</span></div>`).join('')}</div>`:'<div class="none">Aparece aqui conforme os atendimentos forem registrados.</div>'}</div>`;
  }
  return h;
}

function drawClientTable(){

  </tbody></table>`:`<div class="card empty">Nenhuma cliente encontrada para “<b>${esc(ui.q)}</b>”. <p><a class="btn primary" href="#/nova">${ico('plus')}Cadastrar nova cliente</a></p></div>`;

function maskInputs(){
  const t=$('[name=telefone]'),c=$('[name=cpf]');
  if(t)t.oninput=()=>{let d=t.value.replace(/\D/g,'').slice(0,11);t.value=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d};
  if(c)c.oninput=()=>{let d=c.value.replace(/\D/g,'').slice(0,11);c.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
}

  const ss=sessOf(c.id),ph=photosOf(c.id);
  const tabs=[['dados','Dados'],['anamnese','Anamnese'],['evolucao','Evolução',ss.length],['fotos','Antes & Depois',ph.length]];
  let h=`<div class="chead">
    ${avatar(c)}
    <div><h2>${esc(c.nome)}</h2><div class="meta">${[age(c.nascimento),c.telefone,ss[0]?'última visita '+ago(ss[0].data):'sem atendimentos',(()=>{const n=D.appointments.filter(a=>a.clientId===c.id&&a.status==='agendado'&&a.data>=today()).sort(apptSort)[0];return n?`próximo horário: ${fmtDate(n.data).slice(0,5)} às ${n.hora}`:''})()].filter(Boolean).map(esc).join(' · ')}</div></div>
    <div class="actions">

      <button class="btn primary sm" onclick="sessionModal(null,'${c.id}')">${ico('notebook-pen')}Registrar atendimento</button>
      ${c.telefone&&c.whatsapp!==false?`<a class="btn sm" target="_blank" href="https://wa.me/55${esc(c.telefone.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,''))}">WhatsApp</a>`:''}
      <button class="btn sm" onclick="printFicha('${c.id}')">${ico('printer')}Imprimir ficha</button>
      <button class="btn sm danger" onclick="deleteClient('${c.id}')">Excluir</button>
    </div>
  </div>`;
  h+=alertas(c);
  h+=`<div class="tabs">${tabs.map(([k,l,n])=>`<a class="tab ${r.tab===k?'on':''}" href="#/cliente/${c.id}/${k}">${l}${n?`<span class="count">${n}</span>`:''}</a>`).join('')}</div>`;
  if(r.tab==='dados')h+=dadosForm(c)+`<div class="formbar"><div class="card"><button class="btn primary" onclick="saveDados(false,'${c.id}')">Salvar dados</button></div></div>`;

  return h;
}

const thumb=p=>`<div class="thumb" onclick="viewPhoto('${p.id}')"><img src="${blobURL(p.blob)}" loading="lazy"><span class="tag ${p.tipo}">${p.tipo}</span></div>`;
function evolucao(c,ss){

function wirePhotoGrid(){
  const g=$('#phGrid');if(!g)return;

    $$('.ph',g).forEach(el=>{const i=ui.compare.indexOf(el.dataset.id);el.classList.toggle('sel',i>=0);$('.n',el).textContent=i+1});
    const b=$('#cmpBtn');if(b)b.disabled=ui.compare.length!==2;

after.atendimentos=()=>{
  $('#aq').oninput=e=>{ui.aQ=e.target.value;drawAtend()};
  $('#aper').onchange=e=>{ui.aPer=e.target.value;drawAtend()};
  $('#aproc').onchange=e=>{ui.aProc=e.target.value;drawAtend()};
  drawAtend();
};
function drawAtend(){
  const t=today();
  const ini={hoje:t,semana:new Date(Date.now()-6*864e5).toISOString().slice(0,10),mes:t.slice(0,7)+'-01','30':new Date(Date.now()-29*864e5).toISOString().slice(0,10),ano:t.slice(0,4)+'-01-01',tudo:''}[ui.aPer];
  const q=norm(ui.aQ).trim();
  const rows=D.sessions.filter(s=>(s.data||'')>=ini&&(!ui.aProc||s.procedimento===ui.aProc)&&(!q||norm(client(s.clientId)?.nome).includes(q)))
    .sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criado||0)-(a.criado||0));
  $('#acount').textContent=plural(rows.length,'atendimento','atendimentos');
  $('#atbl').innerHTML=rows.length?`<table class="tbl"><thead><tr><th>Data</th><th>Cliente</th><th>Procedimento</th><th class="hide-m">Região</th><th class="hide-m">Fotos</th></tr></thead><tbody>
    ${rows.map(s=>{const c=client(s.clientId);if(!c)return'';const n=D.photos.filter(p=>p.sessionId===s.id).length;
      return `<tr onclick="go('#/cliente/${c.id}/evolucao')"><td>${fmtDate(s.data)}</td><td><div class="who">${avatar(c)}<b style="font-weight:600">${esc(c.nome)}</b></div></td><td>${esc(s.procedimento||'—')}</td><td class="hide-m">${esc(s.regiao||'—')}</td><td class="hide-m">${n?'📷 '+n:'<span class="muted">—</span>'}</td></tr>`}).join('')}
  </tbody></table>`:`<div class="card empty">Nenhum atendimento neste filtro.</div>`;
}

/* ================= AÇÕES: clientes ================= */
async function saveDados(isNew,id){
  const f=$('#fDados');const d=Object.fromEntries(new FormData(f));
  if(!d.nome.trim()){toast('Informe o nome da cliente');f.nome.focus();return}
  const c=isNew?{id:uid(),criado:Date.now(),anamnese:{}}:client(id);
  Object.assign(c,d,{nome:d.nome.trim(),whatsapp:!!d.whatsapp,atualizado:Date.now()});
  await DB.put('clients',c);

let pending=[];
async function addPending(files,box,standalone){
  for(const f of files){if(!f.type.startsWith('image/'))continue;const blob=await compress(f);
    pending.push({id:uid(),blob,tipo:pending.some(p=>p.tipo==='antes')?'depois':'antes',data:today(),regiao:''})}
  drawPending(box,standalone);
}
function drawPending(box,standalone){
  if(!box)return;if(!pending.length){box.innerHTML='';return}
  box.innerHTML=`<div class="pending">${pending.map(p=>`<div class="pend" data-id="${p.id}"><img src="${blobURL(p.blob)}"><div class="ctr">
      <select data-f="tipo">${['antes','depois','outro'].map(t=>`<option value="${t}" ${p.tipo===t?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select>
      ${standalone?`<input type="date" data-f="data" value="${p.data}">`:''}
      <input data-f="regiao" placeholder="Região (ex: rosto)" value="${esc(p.regiao)}">

    ${standalone?`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="pCancel">Cancelar</button><button class="btn primary" id="pSave">Salvar ${plural(pending.length,'foto','fotos')}</button></div>`:''}`;
  $$('.pend',box).forEach(el=>{const p=pending.find(x=>x.id===el.dataset.id);
    $$('[data-f]',el).forEach(i=>i.onchange=()=>p[i.dataset.f]=i.value);
    $('[data-rm]',el).onclick=()=>{pending=pending.filter(x=>x!==p);drawPending(box,standalone)}});
  if(standalone){$('#pCancel',box).onclick=()=>{pending=[];drawPending(box,true)};$('#pSave',box).onclick=()=>savePending(route().id)}

async function savePending(clientId,sessionId,data){
  for(const p of pending)await DB.put('photos',{id:p.id,clientId,sessionId:sessionId||null,tipo:p.tipo,data:data||p.data,regiao:p.regiao,blob:p.blob,criado:Date.now()});
  const n=pending.length;pending=[];await load();render();if(n)toast(`${plural(n,'foto salva','fotos salvas')} ✓`);

function wirePicker(m,onAvulso){
  const pq=$('#pickQ',m),po=$('#pickO',m),hid=$('[name=clientId]',m);
  const drawOpts=()=>{const l=searchClients(pq.value).sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome))).slice(0,8);
    po.innerHTML=l.map(x=>`<div data-id="${x.id}">${esc(x.nome)} <span class="muted" style="font-size:12px">${esc(x.telefone||'')}</span></div>`).join('')||`<div data-new>＋ Cadastrar “${esc(pq.value)}” como nova cliente</div>`;
    if(onAvulso&&pq.value.trim())po.innerHTML+=`<div data-av>◌ Agendar “${esc(pq.value)}” sem cadastro</div>`;
    po.classList.add('on');
    $$('div',po).forEach(o=>o.onmousedown=e=>{e.preventDefault();
      if(o.dataset.av!==undefined){po.classList.remove('on');onAvulso(pq.value.trim());return}

}

/* ================= AGENDA ================= */
const STATUS={agendado:['Agendado',''],realizado:['Realizado','g'],faltou:['Faltou','w'],cancelado:['Cancelado','x']};
function addDays(ymd,n){const d=new Date(ymd+'T12:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const apptSort=(a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora);
const apptsOn=dia=>D.appointments.filter(a=>a.data===dia).sort(apptSort);
const toMin=h=>{const [a,b]=(h||'0:0').split(':').map(Number);return a*60+b};
const fimHora=a=>{const m=toMin(a.hora)+(+a.duracao||60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
const diaLongo=d=>cap1(new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
function apptRowMini(a){
  const c=client(a.clientId);if(!c&&!a.avulsoNome)return'';const [l,cls]=STATUS[a.status]||STATUS.agendado;
  return `<div class="li" onclick="ui.agDay='${a.data}';ui.agMonth='${a.data.slice(0,7)}';go('#/agenda')"><div class="hr">${esc(a.hora)}</div><div class="t"><b>${esc(apptNome(a))}</b><small>${esc(a.procedimento||'Atendimento')}${c?'':' · sem cadastro'}</small></div>${a.status!=='agendado'?`<span class="pill ${cls}">${l}</span>`:''}</div>`;
}
function pAgenda(){
  ui.agDay=ui.agDay||today();ui.agMonth=ui.agMonth||ui.agDay.slice(0,7);
  return `<div class="ptitle"><div><h2>Agenda</h2><p>Clique em um dia para ver os horários marcados</p></div>
    <div class="act"><button class="btn primary" onclick="apptModal(null,{data:ui.agDay})">${ico('plus')}Agendar horário</button></div></div>
  <div class="agenda"><div class="card cal" id="cal"></div><div class="col"><div class="card" id="dayBox"></div><div class="card" id="nextBox"></div></div></div>`;
}
after.agenda=()=>drawAgenda();
function drawAgenda(){
  const [y,m]=ui.agMonth.split('-').map(Number);const first=new Date(y,m-1,1);
  const start=addDays(`${ui.agMonth}-01`,-first.getDay());const t=today();
  const nomeMes=cap1(first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i);const out=d.slice(0,7)!==ui.agMonth;
    if(i===35&&out)break;
    const l=apptsOn(d).filter(a=>a.status!=='cancelado');
    cells+=`<button class="day ${out?'out':''} ${d===t?'today':''} ${d===ui.agDay?'sel':''}" data-d="${d}">
      <span class="n">${+d.slice(8)}</span>
      ${l.length?`<span class="cnt">${l.length}</span><span class="chips-m">${l.slice(0,3).map(a=>`<span class="ev ${a.status}">${esc(a.hora)} ${esc(apptNome(a).split(' ')[0])}</span>`).join('')}${l.length>3?`<span class="more">+${l.length-3}</span>`:''}</span>`:''}
    </button>`;
  }
  $('#cal').innerHTML=`<div class="calh"><button class="btn ghost sm" data-nav="-1">‹</button><h3>${nomeMes}</h3><button class="btn ghost sm" data-nav="1">›</button><button class="btn sm" data-nav="0" style="margin-left:auto">Hoje</button></div>
    <div class="dow">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div>`;
  $$('#cal [data-nav]').forEach(b=>b.onclick=()=>{const n=+b.dataset.nav;
    if(n===0){ui.agDay=t;ui.agMonth=t.slice(0,7)}else{const d=new Date(y,m-1+n,1);ui.agMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}drawAgenda()});
  $$('#cal .day').forEach(b=>b.onclick=()=>{ui.agDay=b.dataset.d;if(b.classList.contains('out'))ui.agMonth=ui.agDay.slice(0,7);drawAgenda();
    if(innerWidth<860)$('#dayBox').scrollIntoView({behavior:'smooth',block:'start'})});
  // dia selecionado
  const l=apptsOn(ui.agDay);
  const avulsos=D.sessions.filter(x=>x.data===ui.agDay&&!D.appointments.some(a=>a.sessionId===x.id));
  $('#dayBox').innerHTML=`<h3>${diaLongo(ui.agDay)}${ui.agDay===t?' <span class="pill">hoje</span>':''}<a href="#" onclick="apptModal(null,{data:ui.agDay});return false">＋ agendar</a></h3>
    ${l.length?l.map(apptRow).join(''):'<div class="none">Nenhum horário marcado neste dia.</div>'}
    ${avulsos.length?`<div class="sub-t">Atendimentos registrados sem agendamento</div>${avulsos.map(x=>{const c=client(x.clientId);return c?`<div class="li" onclick="go('#/cliente/${c.id}/evolucao')"><div class="t"><b>${esc(c.nome)}</b><small>${esc(x.procedimento||'Atendimento')}</small></div><span class="pill g">Realizado</span></div>`:''}).join('')}`:''}`;
  // próximos dias
  const prox=D.appointments.filter(a=>a.status==='agendado'&&a.data>t&&a.data<=addDays(t,7)).sort(apptSort);
  let h='<h3>Próximos 7 dias</h3>',last='';
  if(!prox.length)h+='<div class="none">Nenhum horário marcado nos próximos dias.</div>';
  for(const a of prox){if(a.data!==last){h+=`<div class="sub-t">${diaLongo(a.data)}</div>`;last=a.data}h+=apptRowMini(a)}
  $('#nextBox').innerHTML=h;
}
function apptRow(a){

  const quem=c?`<a href="#/cliente/${c.id}"><b>${esc(nome)}</b></a>${ALERTA_ICON(c)}`:`<b>${esc(nome)}</b>${AVULSO_TAG}`;

          :`<span class="pill ${cls}">${l}</span>${a.sessionId&&c?`<a class="btn sm ghost" href="#/cliente/${c.id}/evolucao">ver atendimento</a>`:`<button class="btn sm ghost" onclick="setApptStatus('${a.id}','agendado')">desfazer</button>`}`}
        ${c?'':`<button class="btn sm" onclick="cadastrarAvulso('${a.id}')">${ico('plus')}Fazer cadastro</button>`}
        <button class="btn sm ghost" onclick="apptModal('${a.id}')">Editar</button>
      </div>
    </div>
  </div>`;
}
const apptNome=a=>client(a.clientId)?.nome||a.avulsoNome||'Cliente removida';
const apptTel=a=>{const c=client(a.clientId);return c?(c.whatsapp!==false?c.telefone:''):(a.avulsoTel||'')};
const AVULSO_TAG=' <span class="pill w" title="Ainda não tem ficha no sistema">sem cadastro</span>';
const ALERTA_ICON=c=>Object.keys(ALERTAS).some(k=>c.anamnese?.[k]==='sim')?' <span title="Possui alerta na anamnese" style="color:var(--danger)">⚠</span>':'';

        <input type="hidden" name="clientId" value="${esc(a.clientId||'')}"><div class="opts" id="pickO"></div>
        <a href="#" class="swap" id="toAv">Pessoa ainda não cadastrada? Agendar sem cadastro</a></div>
      <div class="field full" id="avBox" ${av?'':'style="display:none"'}>
        <label>Pessoa sem cadastro</label>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <input name="avulsoNome" placeholder="Nome *" value="${esc(a.avulsoNome)}">
          <input name="avulsoTel" type="tel" placeholder="WhatsApp (opcional)" value="${esc(a.avulsoTel)}">
        </div>
        <a href="#" class="swap" id="toCli">Escolher uma cliente já cadastrada</a></div>
      <input type="hidden" name="modo" value="${av?'avulso':'cliente'}">
      <div class="field"><label>Data *</label><input type="date" name="data" value="${esc(a.data)}"></div>
      <div class="field"><label>Horário *</label><input name="hora" list="horas" value="${esc(a.hora)}" placeholder="Ex: 14:00" inputmode="numeric"><datalist id="horas">${horas.map(h=>`<option>${h}</option>`).join('')}</datalist></div>
      <div class="field"><label>Duração</label><select name="duracao">${[30,45,60,90,120,180].map(d=>`<option value="${d}" ${+a.duracao===d?'selected':''}>${d<60?d+' min':(d/60)+'h'+(d%60?'30':'')}</option>`).join('')}</select></div>
      <div class="field"><label>Procedimento</label><input name="procedimento" list="procs2" value="${esc(a.procedimento)}" placeholder="Escolha ou digite"><datalist id="procs2">${sug.map(p=>`<option>${esc(p)}</option>`).join('')}</datalist></div>
      <div class="field full"><label>Observação</label><input name="obs" value="${esc(a.obs)}" placeholder="Ex: primeira sessão, trazer exames…"></div>
    </form>
    <div id="apptWarn"></div>
    <div class="mbar">${id?`<button class="btn danger" style="margin-right:auto" onclick="deleteAppt('${id}')">Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="aSave">Salvar</button></div>`);
  const modo=$('[name=modo]',m);
  const setModo=(v,nome)=>{modo.value=v;$('#cliBox',m).style.display=v==='avulso'?'none':'';$('#avBox',m).style.display=v==='avulso'?'':'none';
    if(v==='avulso'){const n=$('[name=avulsoNome]',m);if(nome)n.value=nome;n.focus();$('#apptWarn',m).innerHTML=''}else $('#pickQ',m).focus()};
  const pq=wirePicker(m,nome=>setModo('avulso',nome));
  $('#toAv',m).onclick=e=>{e.preventDefault();setModo('avulso',pq.value.trim())};
  $('#toCli',m).onclick=e=>{e.preventDefault();setModo('cliente')};
  const tl=$('[name=avulsoTel]',m);tl.oninput=()=>{let d=tl.value.replace(/\D/g,'').slice(0,11);tl.value=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d};
  const warn=()=>{const cl=client($('[name=clientId]',m).value);$('#apptWarn',m).innerHTML=cl?alertas(cl):''};
  pq.addEventListener('picked',warn);warn();
  const hr=$('[name=hora]',m);hr.addEventListener('blur',()=>{const d=hr.value.replace(/\D/g,'');if(/^\d{3,4}$/.test(d))hr.value=d.padStart(4,'0').replace(/(\d\d)(\d\d)/,'$1:$2');else if(/^\d{1,2}$/.test(d))hr.value=d.padStart(2,'0')+':00'});
  setTimeout(()=>(a.clientId||av?hr:pq).focus(),30);
  $('#aSave',m).onclick=()=>saveAppt(id);
}
async function saveAppt(id){
  const d=Object.fromEntries(new FormData($('#fAppt')));
  const avulso=d.modo==='avulso';delete d.modo;
  if(avulso){d.avulsoNome=(d.avulsoNome||'').trim();if(!d.avulsoNome)return toast('Informe o nome da pessoa');d.clientId=''}
  else{if(!d.clientId)return toast('Escolha a cliente na lista (ou agende sem cadastro)');d.avulsoNome='';d.avulsoTel=''}
  if(!d.data)return toast('Informe a data');
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.hora))return toast('Informe o horário no formato 14:00');
  d.duracao=+d.duracao;
  const ini=toMin(d.hora),fim=ini+d.duracao;
  const choque=D.appointments.filter(x=>x.id!==id&&x.data===d.data&&x.status==='agendado').find(x=>{const a=toMin(x.hora),b=a+(+x.duracao||60);return ini<b&&a<fim});
  if(choque&&!confirm(`Já existe um horário com ${apptNome(choque)} das ${choque.hora} às ${fimHora(choque)}.\n\nAgendar mesmo assim?`))return;
  const a=id?D.appointments.find(x=>x.id===id):{id:uid(),status:'agendado',criado:Date.now()};
  Object.assign(a,d);await DB.put('appointments',a);
  if(a.procedimento&&!D.procedures.some(p=>norm(p.nome)===norm(a.procedimento)))await DB.put('procedures',{id:uid(),nome:a.procedimento,categoria:'Outros'});
  await load();closeModal();ui.agDay=a.data;ui.agMonth=a.data.slice(0,7);
  toast(`Agendado: ${fmtDate(a.data).slice(0,5)} às ${a.hora} ✓`);
  if(route().page==='agenda')render();else go('#/agenda');
}
async function setApptStatus(id,st){
  const a=D.appointments.find(x=>x.id===id);a.status=st;await DB.put('appointments',a);await load();render();
  toast(st==='agendado'?'Agendamento reaberto':`Marcado como ${STATUS[st][0].toLowerCase()}`);
}
function cadastrarAvulso(id,msg){
  const a=D.appointments.find(x=>x.id===id);ui.linkAppt=id;
  go('#/nova');
  setTimeout(()=>{const n=$('[name=nome]'),t=$('[name=telefone]');if(n)n.value=a.avulsoNome||'';if(t){t.value=a.avulsoTel||''}
    if(msg)toast(msg)},60);
}
function concluirAppt(id){const a=D.appointments.find(x=>x.id===id);
  if(!client(a.clientId))return cadastrarAvulso(id,'Para registrar o atendimento, primeiro faça o cadastro da cliente');
  sessionModal(null,a.clientId,{data:a.data,procedimento:a.procedimento,apptId:a.id})}
async function deleteAppt(id){if(!confirm('Excluir este agendamento?'))return;await DB.del('appointments',id);await load();closeModal();render();toast('Agendamento excluído')}

    </table>
    <h2>Anamnese</h2><div class="cols"><table>${ANAM_ESQ.map(q).join('')}</table><table>${ANAM_DIR.map(q).join('')}</table></div>
    <p style="margin-top:12px"><i>Declaro que as informações acima são verdadeiras, não cabendo ao profissional quaisquer responsabilidades por informações omitidas nessa avaliação.</i></p>
    <div class="sig"><div>Data: ${fmtDate(a.dataAnamnese)||'____/____/______'}</div><div>Assinatura da cliente</div></div>
    <h2>Avaliação da pele</h2><table>
      ${Object.entries(AVAL).map(([k,[l,o]])=>`<tr><td class="k">${l}</td><td>${ch(k,o)}${k==='espessura'&&a.espessuraOutro?' &nbsp; '+esc(a.espessuraOutro):''}</td></tr>`).join('')}
      <tr><td class="k">Alterações</td><td>${LESOES.map(x=>`${box((a.lesoes||[]).includes(x))} ${x}`).join(' &nbsp; ')}${a.lesaoOutro?' &nbsp; ☒ '+esc(a.lesaoOutro):''}</td></tr>

    ${ss.length?`<h2>Atendimentos realizados</h2><table>${ss.map(x=>`<tr><td class="k">${fmtDate(x.data)} — ${esc(x.procedimento||'')}</td><td>${esc([x.regiao,x.detalhes,x.obs].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>`:''}`;
  window.print();

/* ================= backup / exportação ================= */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportBackup(){
  toast('Gerando backup…');
  const photos=[];for(const p of D.photos)photos.push({...p,blob:await toData(p.blob)});
  const data={app:'fichas-estetica',versao:3,gerado:new Date().toISOString(),settings:{nome:settings().nome},...D,photos};
  dl(new Blob([JSON.stringify(data)],{type:'application/json'}),`backup-fichas-${today()}.json`);
  LS.set('fe-lastbackup',Date.now());render();toast('Backup baixado ✓ Guarde fora do computador.');
}
async function importBackup(file){
  try{
    const data=JSON.parse(await file.text());if(data.app!=='fichas-estetica')throw new Error('arquivo inválido');
    if(!confirm(`Restaurar backup de ${new Date(data.gerado).toLocaleString('pt-BR')}?\n${data.clients.length} clientes, ${data.sessions.length} atendimentos, ${data.photos.length} fotos.\n\nFichas iguais serão substituídas pela versão do backup.`))return;
    for(const x of data.clients)await DB.put('clients',x);
    for(const x of data.sessions)await DB.put('sessions',x);
    for(const x of data.procedures||[])await DB.put('procedures',x);
    for(const x of data.appointments||[])await DB.put('appointments',x);
    for(const p of data.photos)await DB.put('photos',{...p,blob:await (await fetch(p.blob)).blob()});
    if(data.settings?.nome)LS.set('fe-settings',{...settings(),nome:data.settings.nome});
    await load();go('#/painel');toast('Backup restaurado ✓');
  }catch(e){alert('Não foi possível ler o backup: '+e.message)}
}
function exportCSV(){
  const cols=[['nome','Nome'],['nascimento','Nascimento'],['telefone','Telefone'],['cpf','CPF'],['email','E-mail'],['profissao','Profissão'],['endereco','Endereço'],['origem','Como conheceu']];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=[cols.map(c=>c[1]).concat(['Atendimentos','Última visita']).join(';'),
    ...[...D.clients].sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome))).map(c=>{const ss=sessOf(c.id);return cols.map(([k])=>q(k==='nascimento'?fmtDate(c[k]):c[k])).concat([ss.length,q(fmtDate(ss[0]?.data))]).join(';')})];
  dl(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),`clientes-${today()}.csv`);
}

  const dt=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
  for(let i=0;i<nomes.length;i++){
    const id='demo_c'+i, mm=String(i===2?new Date().getMonth()+1:(i%12)+1).padStart(2,'0');

      anamnese:i%3===0?{alergia:'sim',alergia_det:'Dipirona',gestante:'nao',sol:'sim',filtro:'sim',oleosidade:'Lipídica',fototipo:'III',lesoes:['Comedão','Rugas'],declaracao:true,dataAnamnese:dt(i*20),plano:'6 sessões de limpeza de pele + peeling'}:{}});
    for(let k=0;k<(i%4)+1;k++){
      const sid=`demo_s${i}_${k}`, d=dt(k*9+i*11);
      await DB.put('sessions',{id:sid,demo:true,clientId:id,data:d,procedimento:procs[(i+k)%5],regiao:'Rosto',detalhes:'Produtos de exemplo',obs:'Boa resposta ao procedimento.',criado:Date.now()});
      if(k===0){await DB.put('photos',{id:`demo_p${i}a`,demo:true,clientId:id,sessionId:sid,tipo:'antes',data:d,regiao:'Rosto',blob:await img('#c99a88','#e6c3b4')});
                await DB.put('photos',{id:`demo_p${i}b`,demo:true,clientId:id,sessionId:sid,tipo:'depois',data:d,regiao:'Rosto',blob:await img('#e9cfc3','#f7ebe5')});}
    }
  }
  const horas=['09:00','10:30','14:00','15:30','17:00'];let n=0;
  for(let d=-3;d<=12;d++){

    const qtd=[2,1,3,0,2,1][(d+8)%6];

      await DB.put('appointments',{id:`demo_a${d}_${k}`,demo:true,clientId:'demo_c'+ci,data:dia,hora:horas[(k*2+d+9)%5],duracao:60,procedimento:procs[(ci+k)%5],obs:'',status:d<0?(k===1?'faltou':'realizado'):'agendado',criado:Date.now()})}

async function clearDemo(){

  await load();render();toast('Exemplos apagados');
}

/* ================= senha ================= */
function lockScreen(){
  return new Promise(res=>{
    const s=settings();if(!s.pin)return res();
    $('#root').innerHTML=`<div class="lock"><div class="card"><div class="logo" style="margin:0 auto 10px">${esc(initials(s.nome)||'LM')}</div><h2>${esc(s.nome)}</h2><input id="pin" type="password" inputmode="numeric" placeholder="••••"><button class="btn primary" style="width:100%;justify-content:center" id="pinOk">Entrar</button><p class="muted" id="pinMsg" style="font-size:13px"></p></div></div>`;
    const ok=()=>{if($('#pin').value===s.pin)res();else{$('#pinMsg').textContent='Senha incorreta';$('#pin').value=''}};
    $('#pinOk').onclick=ok;$('#pin').onkeydown=e=>e.key==='Enter'&&ok();$('#pin').focus();
  });
}

/* ================= início ================= */
(async()=>{
  try{await openDB()}catch(e){document.body.innerHTML='<p style="padding:40px">Este navegador bloqueou o armazenamento. Abra no Google Chrome ou Microsoft Edge.</p>';return}
  try{navigator.storage?.persist?.()}catch{}
  await lockScreen();await load();
  if(!LS.get('fe-seeded',false)&&!D.procedures.length){for(const [nome,categoria] of PROC_PADRAO)await DB.put('procedures',{id:uid(),nome,categoria});LS.set('fe-seeded',true);await load()}
  render();
})();
